[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid retrieval for RAG: BM25 + dense vectors + cross-encoder reranking, fused with reciprocal rank fusion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adeev Mardia" }]
dependencies = [
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
neural = [
    "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
